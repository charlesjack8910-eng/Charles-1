<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>TaskFlow · Personal Task Manager</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ----- CSS reset & variables (navy + sky blue) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f4f7fc;
      color: #0b1a33;
      display: flex;
      min-height: 100vh;
    }
    :root {
      --navy: #0b1a33;
      --navy-light: #1b2f4f;
      --sky: #4b9fe3;
      --sky-light: #d4e7fc;
      --sky-bright: #2b7fc7;
      --card-bg: #ffffff;
      --shadow: 0 10px 25px -8px rgba(0,20,40,0.12);
      --radius: 20px;
      --transition: 0.25s ease;
    }
    /* ----- sidebar (desktop) ----- */
    .sidebar {
      width: 250px;
      background: var(--navy);
      color: white;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.2s ease;
      z-index: 20;
    }
    .sidebar h2 {
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sidebar h2 i {
      color: var(--sky);
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      border-radius: 14px;
      color: #b6cbe0;
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
      margin-bottom: 0.3rem;
    }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: rgba(75, 159, 227, 0.18);
      color: white;
    }
    .sidebar nav a i {
      width: 1.4rem;
      font-size: 1.1rem;
    }
    .sidebar .bottom-links {
      margin-top: auto;
      border-top: 1px solid #2a405f;
      padding-top: 1.5rem;
    }
    /* ----- main content ----- */
    .main {
      flex: 1;
      padding: 1.8rem 2rem 2.5rem;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }
    /* mobile top bar */
    .mobile-header {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .mobile-header button {
      background: var(--navy);
      color: white;
      border: none;
      font-size: 1.8rem;
      padding: 0.3rem 1rem;
      border-radius: 16px;
    }
    /* cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 1.8rem;
      transition: 0.15s;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.3rem 1.2rem;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--sky);
      transition: 0.2s;
    }
    .stat-card h4 {
      font-weight: 500;
      color: #3d5670;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }
    .stat-card .number {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--navy);
    }
    .stat-card .sub {
      color: #4a688a;
      font-size: 0.8rem;
    }
    .progress-bar-bg {
      background: #e4ecf5;
      height: 10px;
      border-radius: 20px;
      margin: 0.5rem 0 0.2rem;
    }
    .progress-fill {
      background: var(--sky);
      height: 10px;
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s;
    }
    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 1.8rem 0 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .section-title i {
      color: var(--sky);
    }
    /* task list */
    .task-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 0.6rem;
      border-bottom: 1px solid #eef3f9;
      transition: 0.1s;
    }
    .task-item:last-child { border-bottom: none; }
    .task-info {
      display: flex;
      flex-direction: column;
      flex: 2 1 180px;
    }
    .task-info .title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .task-info .title .badge {
      font-size: 0.65rem;
      background: var(--sky-light);
      color: var(--navy);
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      font-weight: 500;
    }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-size: 0.8rem;
      color: #3c5a78;
      margin-top: 0.2rem;
    }
    .task-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .task-actions button {
      background: transparent;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: #4a688a;
      transition: 0.2s;
      padding: 0.2rem 0.4rem;
      border-radius: 8px;
    }
    .task-actions button:hover {
      background: #e4ecf5;
      color: var(--navy);
    }
    .btn {
      background: var(--navy);
      border: none;
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid transparent;
    }
    .btn-sky { background: var(--sky); color: white; }
    .btn-sky:hover { background: var(--sky-bright); }
    .btn-outline { background: transparent; border: 1px solid var(--sky); color: var(--navy); }
    .btn-outline:hover { background: var(--sky-light); }
    .btn-danger { background: #d45c5c; }
    /* modal overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      border-radius: 30px;
      padding: 2rem 2rem 1.8rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 50px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin-bottom: 1.2rem; }
    .modal-content label {
      font-weight: 500;
      display: block;
      margin: 0.8rem 0 0.2rem;
      color: #1b2f4f;
    }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #d9e2ed;
      border-radius: 16px;
      font-size: 0.95rem;
    }
    .modal-content .row2 {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .modal-content .row2 > * { flex: 1; min-width: 120px; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }
    /* calendar */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      gap: 0.3rem;
      margin: 1rem 0;
    }
    .cal-header { font-weight: 600; color: var(--navy); text-align: center; padding: 0.4rem; }
    .cal-day {
      background: white;
      border-radius: 40px;
      padding: 0.4rem 0.2rem;
      text-align: center;
      font-size: 0.9rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      transition: 0.1s;
      position: relative;
      min-height: 40px;
    }
    .cal-day.has-task { background: var(--sky-light); font-weight: 600; }
    /* responsiveness */
    @media (max-width: 820px) {
      .sidebar { transform: translateX(-100%); position: fixed; width: 260px; }
      .sidebar.open { transform: translateX(0); }
      .mobile-header { display: flex; }
      .main { padding: 1rem; }
    }
    @media (max-width: 550px) {
      .grid-4 { grid-template-columns: 1fr 1fr; }
      .task-item { flex-direction: column; align-items: stretch; gap: 0.4rem; }
    }
    /* misc */
    .flex { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .mt-1 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.8rem; }
    .chip {
      background: #edf3fa;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .priority-high { border-left: 4px solid #d45c5c; }
    .priority-medium { border-left: 4px solid #f0b34b; }
    .priority-low { border-left: 4px solid #5fa3d1; }
    .completed-task .title { text-decoration: line-through; opacity: 0.6; }
    /* project cards */
    .project-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.2rem 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      border-left: 6px solid var(--sky);
    }
  </style>
</head>
<body>
  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2><i class="fas fa-tasks"></i> TaskFlow</h2>
    <nav>
      <a href="#" class="active" data-section="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="#" data-section="tasks"><i class="fas fa-list-check"></i> Tasks</a>
      <a href="#" data-section="projects"><i class="fas fa-folder-open"></i> Projects</a>
      <a href="#" data-section="calendar"><i class="fas fa-calendar-alt"></i> Calendar</a>
      <a href="#" data-section="notes"><i class="fas fa-pen"></i> Notes</a>
    </nav>
    <div class="bottom-links">
      <a href="#" id="addTaskBtn"><i class="fas fa-plus-circle"></i> New Task</a>
      <a href="#" id="addProjectBtn"><i class="fas fa-plus"></i> New Project</a>
    </div>
  </aside>
  <!-- main -->
  <div class="main">
    <div class="mobile-header">
      <button id="menuToggle"><i class="fas fa-bars"></i></button>
      <span style="font-weight:700;color:var(--navy);"><i class="fas fa-tasks" style="color:var(--sky);"></i> TaskFlow</span>
      <div style="width:2.2rem;"></div>
    </div>
    <!-- dynamic sections -->
    <div id="appContent"></div>
  </div>
  <!-- modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h3 id="modalTitle"><i class="fas fa-plus-circle" style="color:var(--sky);"></i> Add Task</h3>
      <input type="hidden" id="taskEditId" />
      <label>Task title</label>
      <input type="text" id="taskTitle" placeholder="e.g. Build landing page" />
      <div class="row2">
        <div><label>Due date</label><input type="date" id="taskDue" /></div>
        <div><label>Priority</label><select id="taskPriority"><option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option></select></div>
      </div>
      <div class="row2">
        <div><label>Status</label><select id="taskStatus"><option value="To Do">To Do</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></div>
        <div><label>Category</label><select id="taskCategory"><option value="Web Development">Web Development</option><option value="Graphic Design">Graphic Design</option><option value="Projects">Projects</option><option value="Learning">Learning</option><option value="Personal">Personal</option></select></div>
      </div>
      <div><label>Project (optional)</label><select id="taskProject"><option value="">None</option></select></div>
      <label>Notes</label>
      <textarea id="taskNotes" rows="2" placeholder="Details..."></textarea>
      <div class="modal-footer">
        <button class="btn btn-outline" id="closeModalBtn">Cancel</button>
        <button class="btn btn-sky" id="saveTaskBtn"><i class="fas fa-save"></i> Save</button>
      </div>
    </div>
  </div>
  <!-- project modal -->
  <div class="modal" id="projectModal">
    <div class="modal-content">
      <h3><i class="fas fa-folder-plus" style="color:var(--sky);"></i> New Project</h3>
      <label>Project name</label>
      <input type="text" id="projectName" placeholder="e.g. Personal Portfolio" />
      <div class="modal-footer">
        <button class="btn btn-outline" id="closeProjectBtn">Cancel</button>
        <button class="btn btn-sky" id="saveProjectBtn">Create</button>
      </div>
    </div>
  </div>
  <script>
    // ----- data layer -----
    let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [];
    let projects = JSON.parse(localStorage.getItem('taskflow_projects')) || [];
    let notes = JSON.parse(localStorage.getItem('taskflow_notes')) || '';

    function saveData() {
      localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
      localStorage.setItem('taskflow_projects', JSON.stringify(projects));
      localStorage.setItem('taskflow_notes', JSON.stringify(notes));
    }

    // sample tasks
    if (tasks.length === 0 && projects.length === 0) {
      projects = ['Personal Portfolio', 'Website Projects', 'Graphic Design Projects', 'Learning Web Development'];
      localStorage.setItem('taskflow_projects', JSON.stringify(projects));
      tasks = [
        { id: Date.now()+1, title: 'Design portfolio hero', due: '2026-09-05', priority: 'High', status: 'In Progress', category: 'Graphic Design', project: 'Personal Portfolio', notes: 'Use dark theme' },
        { id: Date.now()+2, title: 'Learn flexbox & grid', due: '2026-09-10', priority: 'Medium', status: 'To Do', category: 'Web Development', project: 'Learning Web Development', notes: 'MDN docs' },
        { id: Date.now()+3, title: 'Client logo redesign', due: '2026-08-30', priority: 'High', status: 'Completed', category: 'Graphic Design', project: 'Graphic Design Projects', notes: 'Delivered final' },
        { id: Date.now()+4, title: 'Write article about CSS', due: '2026-09-15', priority: 'Low', status: 'To Do', category: 'Learning', project: '', notes: '' },
        { id: Date.now()+5, title: 'Update personal site', due: '2026-09-02', priority: 'Medium', status: 'In Progress', category: 'Web Development', project: 'Website Projects', notes: 'Add projects section' },
      ];
      saveData();
    }

    // ----- render engine -----
    let currentSection = 'dashboard';

    function render() {
      const container = document.getElementById('appContent');
      if (currentSection === 'dashboard') renderDashboard(container);
      else if (currentSection === 'tasks') renderTasks(container);
      else if (currentSection === 'projects') renderProjects(container);
      else if (currentSection === 'calendar') renderCalendar(container);
      else if (currentSection === 'notes') renderNotes(container);
      updateSidebarActive();
      populateProjectSelects();
    }

    function updateSidebarActive() {
      document.querySelectorAll('.sidebar nav a').forEach(a => {
        a.classList.toggle('active', a.dataset.section === currentSection);
      });
    }

    function populateProjectSelects() {
      const sel = document.getElementById('taskProject');
      if (!sel) return;
      const current = sel.value;
      sel.innerHTML = '<option value="">None</option>' + projects.map(p => `<option value="${p}">${p}</option>`).join('');
      sel.value = current;
    }

    // ----- dashboard -----
    function renderDashboard(el) {
      const total = tasks.length;
      const completed = tasks.filter(t => t.status === 'Completed').length;
      const pending = tasks.filter(t => t.status !== 'Completed').length;
      const overdue = tasks.filter(t => t.due && new Date(t.due) < new Date() && t.status !== 'Completed').length;
      const today = tasks.filter(t => t.due === new Date().toISOString().slice(0,10)).length;
      const progress = total ? Math.round((completed/total)*100) : 0;

      el.innerHTML = `
        <div style="margin-bottom:1.5rem;"><h1 style="font-size:1.8rem;">👋 Welcome back</h1><p style="color:#3d5670;">Track your learning, projects & daily tasks.</p></div>
        <div class="grid-4">
          <div class="stat-card"><h4>Total tasks</h4><div class="number">${total}</div></div>
          <div class="stat-card" style="border-left-color:#2b7fc7;"><h4>Completed</h4><div class="number">${completed}</div><div class="sub">${progress}% done</div><div class="progress-bar-bg"><div class="progress-fill" style="width:${progress}%;"></div></div></div>
          <div class="stat-card" style="border-left-color:#f0b34b;"><h4>Pending</h4><div class="number">${pending}</div></div>
          <div class="stat-card" style="border-left-color:#d45c5c;"><h4>Overdue</h4><div class="number">${overdue}</div></div>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:1rem;">
          <div class="card" style="flex:1; min-width:160px;"><i class="fas fa-calendar-day" style="color:var(--sky);"></i> Today's tasks: <strong>${today}</strong></div>
          <div class="card" style="flex:2; min-width:200px;"><i class="fas fa-clock"></i> Weekly completed: ${tasks.filter(t => { const d = new Date(t.due); const now = new Date(); const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7); return t.status==='Completed' && d>=weekAgo; }).length}</div>
        </div>
        <div class="section-title"><i class="fas fa-folder-open"></i> Projects overview</div>
        ${projects.length ? projects.map(p => {
          const pt = tasks.filter(t => t.project === p);
          const done = pt.filter(t => t.status === 'Completed').length;
          const pct = pt.length ? Math.round((done/pt.length)*100) : 0;
          return `<div class="project-card"><div style="display:flex;justify-content:space-between;"><strong>${p}</strong> <span>${done}/${pt.length} done</span></div><div class="progress-bar-bg"><div class="progress-fill" style="width:${pct}%;"></div></div></div>`;
        }).join('') : '<div class="card">No projects yet. Create one!</div>'}
      `;
    }

    // ----- tasks -----
    function renderTasks(el) {
      let html = `<div class="flex" style="justify-content:space-between;flex-wrap:wrap;"><h2 class="section-title"><i class="fas fa-list-check"></i> All Tasks</h2><button class="btn btn-sky" id="addTaskFromTasks"><i class="fas fa-plus"></i> Add Task</button></div>`;
      html += `<div style="display:flex; flex-wrap:wrap; gap:0.5rem 1rem; margin-bottom:1rem;">
        <input type="text" id="searchTask" placeholder="🔍 Search tasks..." style="padding:0.5rem 1rem;border-radius:40px;border:1px solid #d9e2ed;flex:1;min-width:140px;" />
        <select id="filterCategory" style="padding:0.5rem 1rem;border-radius:40px;"><option value="">All categories</option><option>Web Development</option><option>Graphic Design</option><option>Projects</option><option>Learning</option><option>Personal</option></select>
        <select id="filterPriority" style="padding:0.5rem 1rem;border-radius:40px;"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option></select>
        <select id="filterStatus" style="padding:0.5rem 1rem;border-radius:40px;"><option value="">All status</option><option>To Do</option><option>In Progress</option><option>Completed</option></select>
      </div>`;
      const filtered = tasks.filter(t => {
        const search = document.getElementById('searchTask')?.value?.toLowerCase() || '';
        const cat = document.getElementById('filterCategory')?.value || '';
        const pri = document.getElementById('filterPriority')?.value || '';
        const stat = document.getElementById('filterStatus')?.value || '';
        return (t.title.toLowerCase().includes(search) || t.notes?.toLowerCase().includes(search)) &&
          (!cat || t.category === cat) && (!pri || t.priority === pri) && (!stat || t.status === stat);
      });
      if (!filtered.length) html += `<div class="card" style="text-align:center;padding:2rem;">No tasks match 😴</div>`;
      else filtered.forEach(t => {
        const isCompleted = t.status === 'Completed';
        html += `<div class="task-item ${isCompleted?'completed-task':''} priority-${t.priority.toLowerCase()}">
          <div class="task-info"><div class="title">${t.title} <span class="badge">${t.status}</span><span class="chip">${t.priority}</span></div>
          <div class="task-meta"><span><i class="far fa-calendar-alt"></i> ${t.due || 'No due'}</span><span><i class="fas fa-tag"></i> ${t.category}</span>${t.project ? `<span><i class="fas fa-folder"></i> ${t.project}</span>`:''}</div>
          ${t.notes ? `<div style="font-size:0.75rem;color:#3f5f7f;">📝 ${t.notes}</div>`:''}</div>
          <div class="task-actions">
            <button onclick="editTask('${t.id}')"><i class="fas fa-pen"></i></button>
            <button onclick="deleteTask('${t.id}')"><i class="fas fa-trash-alt"></i></button>
            <button onclick="toggleComplete('${t.id}')"><i class="fas ${isCompleted ? 'fa-rotate-left' : 'fa-check-circle'}"></i></button>
          </div>
        </div>`;
      });
      el.innerHTML = html;
      // attach listeners
      document.getElementById('addTaskFromTasks')?.addEventListener('click', ()=>openTaskModal());
      document.getElementById('searchTask')?.addEventListener('input', render);
      document.getElementById('filterCategory')?.addEventListener('change', render);
      document.getElementById('filterPriority')?.addEventListener('change', render);
      document.getElementById('filterStatus')?.addEventListener('change', render);
    }

    // ----- projects -----
    function renderProjects(el) {
      let html = `<div class="flex" style="justify-content:space-between;"><h2 class="section-title"><i class="fas fa-folder-open"></i> Projects</h2><button class="btn btn-sky" id="addProjectFromProjects"><i class="fas fa-plus"></i> New Project</button></div>`;
      projects.forEach(p => {
        const pt = tasks.filter(t => t.project === p);
        const done = pt.filter(t => t.status === 'Completed').length;
        const pct = pt.length ? Math.round((done/pt.length)*100) : 0;
        html += `<div class="project-card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;"><strong>${p}</strong> <span>${done}/${pt.length} tasks done (${pct}%)</span></div><div class="progress-bar-bg"><div class="progress-fill" style="width:${pct}%;"></div></div><div style="margin-top:0.4rem;font-size:0.8rem;">${pt.map(t=>`<span class="chip">${t.title}</span>`).join(' ') || 'No tasks yet'}</div></div>`;
      });
      if (!projects.length) html += `<div class="card">No projects. Create your first project!</div>`;
      el.innerHTML = html;
      document.getElementById('addProjectFromProjects')?.addEventListener('click', ()=>openProjectModal());
    }

    // ----- calendar -----
    function renderCalendar(el) {
      const today = new Date();
      const year = today.getFullYear(), month = today.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      let html = `<h2 class="section-title"><i class="fas fa-calendar-alt"></i> ${today.toLocaleString('default',{month:'long'})} ${year}</h2><div class="calendar-grid">`;
      ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => html += `<div class="cal-header">${d}</div>`);
      for (let i=0; i< (firstDay===0 ? 6 : firstDay-1); i++) html += `<div class="cal-day"></div>`;
      for (let d=1; d<=daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const hasTask = tasks.some(t => t.due === dateStr);
        html += `<div class="cal-day ${hasTask?'has-task':''}">${d}</div>`;
      }
      html += `</div><div class="card mt-1"><i class="fas fa-circle" style="color:var(--sky-light);"></i> Highlighted days have tasks due.</div>`;
      el.innerHTML = html;
    }

    // ----- notes -----
    function renderNotes(el) {
      el.innerHTML = `<h2 class="section-title"><i class="fas fa-pen"></i> Notes</h2>
        <div class="card"><textarea id="notesArea" rows="6" style="width:100%;border:1px solid #d9e2ed;border-radius:16px;padding:1rem;">${notes}</textarea>
        <button class="btn btn-sky mt-1" id="saveNotesBtn"><i class="fas fa-save"></i> Save notes</button></div>`;
      document.getElementById('saveNotesBtn')?.addEventListener('click', ()=>{
        notes = document.getElementById('notesArea').value;
        saveData();
        alert('Notes saved!');
      });
    }

    // ----- CRUD -----
    function openTaskModal(task) {
      document.getElementById('taskModal').classList.add('show');
      if (task) {
        document.getElementById('modalTitle').innerHTML = `<i class="fas fa-pen" style="color:var(--sky);"></i> Edit Task`;
        document.getElementById('taskEditId').value = task.id;
        document.getElementById('taskTitle').value = task.title;
        document.getElementById('taskDue').value = task.due || '';
        document.getElementById('taskPriority').value = task.priority;
        document.getElementById('taskStatus').value = task.status;
        document.getElementById('taskCategory').value = task.category;
        document.getElementById('taskProject').value = task.project || '';
        document.getElementById('taskNotes').value = task.notes || '';
      } else {
        document.getElementById('modalTitle').innerHTML = `<i class="fas fa-plus-circle" style="color:var(--sky);"></i> Add Task`;
        document.getElementById('taskEditId').value = '';
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDue').value = '';
        document.getElementById('taskPriority').value = 'Medium';
        document.getElementById('taskStatus').value = 'To Do';
        document.getElementById('taskCategory').value = 'Web Development';
        document.getElementById('taskProject').value = '';
        document.getElementById('taskNotes').value = '';
      }
      populateProjectSelects();
    }

    document.getElementById('addTaskBtn').addEventListener('click', (e) => { e.preventDefault(); openTaskModal(); });
    document.getElementById('closeModalBtn').addEventListener('click', ()=>document.getElementById('taskModal').classList.remove('show'));
    document.getElementById('saveTaskBtn').addEventListener('click', ()=>{
      const id = document.getElementById('taskEditId').value;
      const title = document.getElementById('taskTitle').value.trim();
      if (!title) return alert('Title is required');
      const due = document.getElementById('taskDue').value;
      const priority = document.getElementById('taskPriority').value;
      const status = document.getElementById('taskStatus').value;
      const category = document.getElementById('taskCategory').value;
      const project = document.getElementById('taskProject').value;
      const notes = document.getElementById('taskNotes').value.trim();
      if (id) {
        const idx = tasks.findIndex(t => t.id == id);
        if (idx > -1) tasks[idx] = { ...tasks[idx], title, due, priority, status, category, project, notes };
      } else {
        tasks.push({ id: Date.now(), title, due, priority, status, category, project, notes });
      }
      saveData();
      document.getElementById('taskModal').classList.remove('show');
      render();
    });

    window.editTask = function(id) {
      const task = tasks.find(t => t.id == id);
      if (task) openTaskModal(task);
    };
    window.deleteTask = function(id) {
      if (confirm('Delete this task?')) {
        tasks = tasks.filter(t => t.id != id);
        saveData();
        render();
      }
    };
    window.toggleComplete = function(id) {
      const task = tasks.find(t => t.id == id);
      if (task) {
        task.status = task.status === 'Completed' ? 'To Do' : 'Completed';
        saveData();
        render();
      }
    };

    // project modal
    function openProjectModal() { document.getElementById('projectModal').classList.add('show'); }
    document.getElementById('addProjectBtn').addEventListener('click', (e)=>{e.preventDefault(); openProjectModal();});
    document.getElementById('closeProjectBtn').addEventListener('click', ()=>document.getElementById('projectModal').classList.remove('show'));
    document.getElementById('saveProjectBtn').addEventListener('click', ()=>{
      const name = document.getElementById('projectName').value.trim();
      if (!name) return alert('Enter project name');
      if (!projects.includes(name)) projects.push(name);
      saveData();
      document.getElementById('projectModal').classList.remove('show');
      document.getElementById('projectName').value = '';
      render();
    });

    // navigation
    document.querySelectorAll('.sidebar nav a').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        currentSection = a.dataset.section;
        render();
        if (window.innerWidth < 820) document.getElementById('sidebar').classList.remove('open');
      });
    });
    document.getElementById('menuToggle').addEventListener('click', ()=>{
      document.getElementById('sidebar').classList.toggle('open');
    });
    // init
    render();
  </script>
</body>
</html>
