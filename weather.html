<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather · colorful</title>
   <link rel="icon" type="image/png" href="weather.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
      color: #1e2b37;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 20, 30, 0.15);
      padding: 2rem 2rem 1.8rem;
      transition: 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* ----- header & search ----- */
    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 0.5rem;
      margin-bottom: 2rem;
    }

    .app-header h1 {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .app-header h1 i {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
    }

    .search-wrapper {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .search-box {
      display: flex;
      background: white;
      border-radius: 60px;
      padding: 0.1rem 0.1rem 0.1rem 1.2rem;
      align-items: center;
      transition: 0.2s;
      border: 2px solid #e8d5f5;
      box-shadow: 0 4px 12px rgba(240, 147, 251, 0.15);
    }

    .search-box:focus-within {
      border-color: #f093fb;
      box-shadow: 0 4px 20px rgba(240, 147, 251, 0.25);
      transform: scale(1.01);
    }

    .search-box input {
      border: none;
      background: transparent;
      padding: 0.7rem 0.2rem;
      font-size: 0.95rem;
      min-width: 180px;
      outline: none;
      color: #1a2d3b;
    }

    .search-box input::placeholder {
      color: #b8a0c9;
      font-weight: 300;
    }

    .search-box button {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      color: white;
      font-size: 1rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(245, 87, 108, 0.3);
    }

    .search-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
    }

    .location-btn {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      border: 2px solid #b8e6e3;
      border-radius: 40px;
      padding: 0.55rem 1.2rem;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #1d4055;
      transition: 0.2s;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(168, 237, 234, 0.2);
    }

    .location-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 237, 234, 0.35);
      border-color: #7dd3d0;
    }

    .unit-toggle {
      display: flex;
      background: white;
      border-radius: 40px;
      overflow: hidden;
      border: 2px solid #d4b8e6;
      box-shadow: 0 4px 12px rgba(200, 160, 220, 0.15);
    }

    .unit-toggle button {
      background: transparent;
      border: none;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: #5a3d6e;
      transition: 0.2s;
    }

    .unit-toggle button.active {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
      box-shadow: 0 2px 10px rgba(240, 147, 251, 0.3);
    }

    .unit-toggle button:hover:not(.active) {
      background: #f5edfa;
    }

    /* ----- loading & error ----- */
    .status-area {
      min-height: 2.8rem;
      margin: 0.2rem 0 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .loader {
      display: none;
      align-items: center;
      gap: 0.6rem;
      color: #7c4a9e;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .loader i {
      font-size: 1.2rem;
      animation: spin 1s linear infinite;
      color: #f5576c;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      color: #8b3a3a;
      font-size: 0.9rem;
      border-left: 5px solid #f5576c;
      font-weight: 500;
    }

    /* ----- main weather card ----- */
    .weather-main {
      display: grid;
      grid-template-columns: 1fr 1.2fr 0.9fr;
      gap: 1.5rem;
      background: linear-gradient(135deg, #f5f0ff 0%, #e8f4f8 100%);
      padding: 2rem 2rem 1.8rem;
      border-radius: 32px;
      margin-bottom: 2rem;
      align-items: center;
      border: 1px solid rgba(240, 147, 251, 0.2);
      box-shadow: 0 8px 30px rgba(200, 160, 220, 0.12);
    }

    .weather-temp {
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-temp span {
      font-size: 2.2rem;
      font-weight: 300;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-condition {
      font-size: 1.4rem;
      font-weight: 500;
      text-transform: capitalize;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #2d1b3e;
    }

    .weather-condition img {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
    }

    .weather-location {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-location small {
      font-weight: 400;
      font-size: 1rem;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-left: 0.3rem;
    }

    .highlow {
      display: flex;
      gap: 1.2rem;
      font-size: 1rem;
      color: #3a2a4a;
      font-weight: 500;
    }

    .highlow span i {
      margin-right: 0.2rem;
      opacity: 0.7;
    }

    .highlow span:first-child i {
      color: #f5576c;
    }
    .highlow span:last-child i {
      color: #4facfe;
    }

    /* ----- details grid ----- */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 1.2rem 0.8rem;
      background: linear-gradient(135deg, #fff5f9, #f0f4ff);
      padding: 1.6rem 1.2rem;
      border-radius: 28px;
      margin: 1.8rem 0 2rem;
      border: 1px solid rgba(240, 147, 251, 0.15);
      box-shadow: 0 4px 20px rgba(200, 160, 220, 0.08);
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0.3rem;
      border-radius: 16px;
      transition: 0.2s;
    }

    .detail-item:hover {
      background: rgba(240, 147, 251, 0.08);
      transform: translateY(-2px);
    }

    .detail-item i {
      font-size: 1.4rem;
      margin-bottom: 0.2rem;
    }

    .detail-item i.fa-wind { color: #4facfe; }
    .detail-item i.fa-eye { color: #43e97b; }
    .detail-item i.fa-gauge-high { color: #fa709a; }

    .detail-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7a5d8a;
      font-weight: 600;
    }

    .detail-item .value {
      font-weight: 600;
      font-size: 1rem;
      margin-top: 0.1rem;
      color: #2d1b3e;
    }

    /* ----- hourly & daily forecast ----- */
    .forecast-section {
      display: grid;
      grid-template-columns: 2fr 1.3fr;
      gap: 1.5rem;
      margin: 1.8rem 0 1.5rem;
    }

    .hourly-forecast, .daily-forecast {
      background: linear-gradient(135deg, #fff5f9, #f0f4ff);
      border-radius: 24px;
      padding: 1.2rem 0.8rem;
      border: 1px solid rgba(240, 147, 251, 0.12);
      box-shadow: 0 4px 16px rgba(200, 160, 220, 0.08);
    }

    .forecast-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin: 0 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .forecast-title i {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hourly-list {
      display: flex;
      overflow-x: auto;
      gap: 1.8rem;
      padding: 0.2rem 0.8rem 0.6rem;
      scrollbar-width: thin;
    }

    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 55px;
      font-size: 0.8rem;
      gap: 0.2rem;
      padding: 0.4rem 0.2rem;
      border-radius: 12px;
      transition: 0.2s;
    }

    .hourly-item:hover {
      background: rgba(240, 147, 251, 0.1);
    }

    .hourly-item img {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
    }

    .hourly-item span:last-child {
      font-weight: 600;
      color: #2d1b3e;
    }

    .daily-list {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .daily-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.7rem;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .daily-item:hover {
      background: rgba(240, 147, 251, 0.08);
    }

    .daily-item .day {
      font-weight: 600;
      width: 65px;
      color: #3a2a4a;
    }

    .daily-item img {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
    }

    .daily-item .temps {
      display: flex;
      gap: 0.8rem;
      font-weight: 400;
    }

    .daily-item .temps .high {
      font-weight: 600;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sun-block {
      background: linear-gradient(135deg, #fdfcfb, #fff5f9);
      padding: 1rem 1.4rem;
      border-radius: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      border: 1px solid rgba(240, 147, 251, 0.12);
      box-shadow: 0 4px 16px rgba(200, 160, 220, 0.06);
    }

    .sun-block span {
      font-weight: 500;
      color: #2d1b3e;
    }

    .sun-block i.fa-sunrise {
      color: #f093fb;
      margin-right: 0.4rem;
    }

    .sun-block i.fa-sunset {
      color: #f5576c;
      margin-right: 0.4rem;
    }

    .sun-block span:last-child i {
      color: #4facfe;
    }

    /* footer */
    .app-footer {
      margin-top: 2.2rem;
      font-size: 0.75rem;
      text-align: center;
      border-top: 1px solid rgba(240, 147, 251, 0.15);
      padding-top: 1.4rem;
      letter-spacing: 0.2px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
    }

    /* responsive */
    @media (max-width: 820px) {
      .app { padding: 1.5rem; }
      .weather-main { grid-template-columns: 1fr; text-align: center; gap: 0.8rem; }
      .highlow { justify-content: center; }
      .forecast-section { grid-template-columns: 1fr; }
      .app-header { flex-direction: column; align-items: stretch; }
      .search-wrapper { flex-wrap: wrap; }
      .search-box { flex: 1; }
      .search-box input { min-width: 120px; width: 100%; }
    }

    @media (max-width: 480px) {
      .weather-temp { font-size: 3rem; }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <header class="app-header">
    <h1><i class="fas fa-cloud-sun"></i> weather</h1>
    <div class="search-wrapper">
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Search city..." value="London">
        <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
      </div>
      <button class="location-btn" id="locationBtn"><i class="fas fa-location-dot"></i> Use my location</button>
      <div class="unit-toggle" id="unitToggle">
        <button class="active" data-unit="metric">°C</button>
        <button data-unit="imperial">°F</button>
      </div>
    </div>
  </header>

  <div class="status-area">
    <div class="loader" id="loader"><i class="fas fa-circle-notch"></i> Loading weather…</div>
    <div class="error-msg" id="errorMsg"><i class="fas fa-triangle-exclamation"></i> <span id="errorText">City not found</span></div>
  </div>

  <section class="weather-main" id="currentWeather">
    <div>
      <div class="weather-temp" id="tempDisplay">--<span>°C</span></div>
      <div class="highlow">
        <span><i class="fas fa-arrow-up"></i> <span id="highTemp">--</span>°</span>
        <span><i class="fas fa-arrow-down"></i> <span id="lowTemp">--</span>°</span>
      </div>
    </div>
    <div>
      <div class="weather-condition">
        <img id="weatherIcon" src="https://openweathermap.org/img/wn/10d@2x.png" alt="weather icon">
        <span id="conditionText">clear sky</span>
      </div>
      <div class="weather-location" id="locationDisplay">London <small>GB</small></div>
    </div>
    <div style="text-align: right; font-size: 0.95rem; color: #3a2a4a; font-weight: 500;">
      <div>Feels like <span id="feelsLike" style="background: linear-gradient(135deg, #4facfe, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">--</span>°</div>
      <div style="margin-top: 0.3rem;"><i class="fas fa-droplet" style="color: #4facfe;"></i> <span id="humidity">--</span>%</div>
    </div>
  </section>

  <div class="details-grid" id="detailsGrid">
    <div class="detail-item"><i class="fas fa-wind"></i><span class="label">Wind</span><span class="value" id="windSpeed">-- km/h</span></div>
    <div class="detail-item"><i class="fas fa-eye"></i><span class="label">Visibility</span><span class="value" id="visibility">-- km</span></div>
    <div class="detail-item"><i class="fas fa-gauge-high"></i><span class="label">Pressure</span><span class="value" id="pressure">-- hPa</span></div>
  </div>

  <div class="forecast-section">
    <div class="hourly-forecast">
      <div class="forecast-title"><i class="fas fa-clock"></i> Hourly forecast</div>
      <div class="hourly-list" id="hourlyList"></div>
    </div>
    <div class="daily-forecast">
      <div class="forecast-title"><i class="fas fa-calendar-day"></i> 5-day forecast</div>
      <div class="daily-list" id="dailyList"></div>
    </div>
  </div>

  <div class="sun-block">
    <span><i class="fas fa-sunrise"></i> Sunrise <span id="sunrise">--</span></span>
    <span><i class="fas fa-sunset"></i> Sunset <span id="sunset">--</span></span>
  </div>

  <footer class="app-footer">weather · real‑time data from OpenWeatherMap</footer>
</div>

<script>
  // ============================================================
  //  🔑 IMPORTANT: Replace with your own OpenWeatherMap API key
  //  Get one for free at: https://openweathermap.org/api
  // ============================================================
  const API_KEY = "e1317a2cfe9b548529e769f14deaa6ff";

  const BASE_WEATHER = "https://api.openweathermap.org/data/2.5/weather";
  const BASE_FORECAST = "https://api.openweathermap.org/data/2.5/forecast";

  let currentUnit = "metric";
  let lastCity = localStorage.getItem("lastCity") || "London";
  let currentWeatherData = null;
  let currentForecastData = null;

  const cityInput = document.getElementById("cityInput");
  const searchBtn = document.getElementById("searchBtn");
  const locationBtn = document.getElementById("locationBtn");
  const unitBtns = document.querySelectorAll("#unitToggle button");
  const loader = document.getElementById("loader");
  const errorMsg = document.getElementById("errorMsg");
  const errorText = document.getElementById("errorText");

  const tempDisplay = document.getElementById("tempDisplay");
  const highTemp = document.getElementById("highTemp");
  const lowTemp = document.getElementById("lowTemp");
  const weatherIcon = document.getElementById("weatherIcon");
  const conditionText = document.getElementById("conditionText");
  const locationDisplay = document.getElementById("locationDisplay");
  const feelsLike = document.getElementById("feelsLike");
  const humidity = document.getElementById("humidity");
  const windSpeed = document.getElementById("windSpeed");
  const visibility = document.getElementById("visibility");
  const pressure = document.getElementById("pressure");
  const sunrise = document.getElementById("sunrise");
  const sunset = document.getElementById("sunset");
  const hourlyList = document.getElementById("hourlyList");
  const dailyList = document.getElementById("dailyList");

  function formatTemp(kelvin) {
    if (currentUnit === "metric") return Math.round(kelvin - 273.15);
    return Math.round((kelvin - 273.15) * 9/5 + 32);
  }

  function formatSpeed(mps) {
    if (currentUnit === "metric") return (mps * 3.6).toFixed(1) + " km/h";
    return (mps * 2.23694).toFixed(1) + " mph";
  }

  function formatVisibility(meters) {
    if (currentUnit === "metric") return (meters / 1000).toFixed(1) + " km";
    return (meters / 1609.34).toFixed(1) + " mi";
  }

  function formatPressure(hpa) {
    if (currentUnit === "metric") return hpa + " hPa";
    return (hpa * 0.02953).toFixed(2) + " inHg";
  }

  function timeFromTimestamp(ts, timezoneOffset) {
    const d = new Date((ts + timezoneOffset) * 1000);
    return d.toUTCString().slice(16, 21);
  }

  function getDayName(ts) {
    return new Date(ts * 1000).toLocaleDateString('en-US', { weekday: 'short' });
  }

  function showError(msg) {
    errorText.textContent = msg || "Something went wrong.";
    errorMsg.style.display = "flex";
    setTimeout(() => { errorMsg.style.display = "none"; }, 5000);
  }

  function showLoader(show) {
    loader.style.display = show ? "flex" : "none";
  }

  async function fetchWeather(city) {
    const url = `${BASE_WEATHER}?q=${encodeURIComponent(city)}&appid=${API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) {
      if (res.status === 401) throw new Error("Invalid API key. Please get a free key from OpenWeatherMap.");
      throw new Error("City not found");
    }
    return res.json();
  }

  async function fetchForecast(city) {
    const url = `${BASE_FORECAST}?q=${encodeURIComponent(city)}&appid=${API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) {
      if (res.status === 401) throw new Error("Invalid API key. Please get a free key from OpenWeatherMap.");
      throw new Error("Forecast unavailable");
    }
    return res.json();
  }

  async function fetchWeatherByCoords(lat, lon) {
    const url = `${BASE_WEATHER}?lat=${lat}&lon=${lon}&appid=${API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) {
      if (res.status === 401) throw new Error("Invalid API key. Please get a free key from OpenWeatherMap.");
      throw new Error("Location weather unavailable");
    }
    return res.json();
  }

  async function fetchForecastByCoords(lat, lon) {
    const url = `${BASE_FORECAST}?lat=${lat}&lon=${lon}&appid=${API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) {
      if (res.status === 401) throw new Error("Invalid API key. Please get a free key from OpenWeatherMap.");
      throw new Error("Forecast unavailable");
    }
    return res.json();
  }

  function updateCurrentWeather(data) {
    currentWeatherData = data;
    const { main, weather, wind, visibility: vis, sys, name, timezone } = data;
    const tempK = main.temp;
    const feelsK = main.feels_like;
    const tempMin = main.temp_min;
    const tempMax = main.temp_max;

    tempDisplay.innerHTML = `${formatTemp(tempK)}<span>°C</span>`;
    highTemp.textContent = formatTemp(tempMax);
    lowTemp.textContent = formatTemp(tempMin);
    feelsLike.textContent = formatTemp(feelsK);
    humidity.textContent = main.humidity;
    windSpeed.textContent = formatSpeed(wind.speed);
    visibility.textContent = formatVisibility(vis);
    pressure.textContent = formatPressure(main.pressure);
    conditionText.textContent = weather[0].description;
    weatherIcon.src = `https://openweathermap.org/img/wn/${weather[0].icon}@2x.png`;
    locationDisplay.innerHTML = `${name} <small>${sys.country}</small>`;

    const offset = timezone || 0;
    sunrise.textContent = timeFromTimestamp(sys.sunrise, offset);
    sunset.textContent = timeFromTimestamp(sys.sunset, offset);

    lastCity = name;
    localStorage.setItem("lastCity", name);
  }

  function updateForecast(data) {
    currentForecastData = data;
    const list = data.list;
    hourlyList.innerHTML = "";
    for (let i = 0; i < 8 && i < list.length; i++) {
      const item = list[i];
      const dt = new Date(item.dt * 1000);
      const hour = dt.getHours().toString().padStart(2, '0') + ":00";
      const icon = item.weather[0].icon;
      const temp = formatTemp(item.main.temp);
      const div = document.createElement("div");
      div.className = "hourly-item";
      div.innerHTML = `
        <span>${hour}</span>
        <img src="https://openweathermap.org/img/wn/${icon}.png" alt="icon">
        <span>${temp}°</span>
      `;
      hourlyList.appendChild(div);
    }

    const dailyMap = new Map();
    list.forEach(item => {
      const date = new Date(item.dt * 1000).toDateString();
      if (!dailyMap.has(date)) {
        dailyMap.set(date, { 
          day: getDayName(item.dt), 
          icon: item.weather[0].icon,
          min: item.main.temp_min,
          max: item.main.temp_max,
          count: 1
        });
      } else {
        const entry = dailyMap.get(date);
        entry.min = Math.min(entry.min, item.main.temp_min);
        entry.max = Math.max(entry.max, item.main.temp_max);
        entry.count++;
      }
    });
    const dailyArr = Array.from(dailyMap.values()).slice(0, 5);
    dailyList.innerHTML = "";
    dailyArr.forEach(day => {
      const div = document.createElement("div");
      div.className = "daily-item";
      div.innerHTML = `
        <span class="day">${day.day}</span>
        <img src="https://openweathermap.org/img/wn/${day.icon}.png" alt="icon">
        <div class="temps"><span class="high">${formatTemp(day.max)}°</span> ${formatTemp(day.min)}°</div>
      `;
      dailyList.appendChild(div);
    });
  }

  async function loadWeather(city) {
    showLoader(true);
    errorMsg.style.display = "none";
    try {
      const weatherData = await fetchWeather(city);
      const forecastData = await fetchForecast(city);
      updateCurrentWeather(weatherData);
      updateForecast(forecastData);
    } catch (err) {
      showError(err.message || "Could not load weather");
    } finally {
      showLoader(false);
    }
  }

  async function loadWeatherByCoords(lat, lon) {
    showLoader(true);
    errorMsg.style.display = "none";
    try {
      const weatherData = await fetchWeatherByCoords(lat, lon);
      const forecastData = await fetchForecastByCoords(lat, lon);
      updateCurrentWeather(weatherData);
      updateForecast(forecastData);
      lastCity = weatherData.name;
      localStorage.setItem("lastCity", lastCity);
      cityInput.value = lastCity;
    } catch (err) {
      showError(err.message || "Location weather unavailable");
    } finally {
      showLoader(false);
    }
  }

  function updateUnit(unit) {
    currentUnit = unit;
    unitBtns.forEach(btn => btn.classList.toggle("active", btn.dataset.unit === unit));
    if (currentWeatherData) updateCurrentWeather(currentWeatherData);
    if (currentForecastData) updateForecast(currentForecastData);
    const symbol = unit === "metric" ? "°C" : "°F";
    const tempValue = tempDisplay.textContent.replace(/[°CF]/g, '').trim();
    tempDisplay.innerHTML = `${tempValue}<span>°${symbol === "°C" ? "C" : "F"}</span>`;
  }

  searchBtn.addEventListener("click", () => {
    const city = cityInput.value.trim();
    if (city) loadWeather(city);
  });

  cityInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const city = cityInput.value.trim();
      if (city) loadWeather(city);
    }
  });

  locationBtn.addEventListener("click", () => {
    if (!navigator.geolocation) {
      showError("Geolocation not supported");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        loadWeatherByCoords(latitude, longitude);
      },
      () => showError("Unable to retrieve location")
    );
  });

  unitBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const unit = btn.dataset.unit;
      if (unit !== currentUnit) updateUnit(unit);
    });
  });

  (function init() {
    cityInput.value = lastCity;
    loadWeather(lastCity);
  })();
</script>
</body>
</html>
